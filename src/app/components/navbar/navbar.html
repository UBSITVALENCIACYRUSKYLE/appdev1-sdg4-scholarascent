<header class="navbar" role="banner">
  <nav class="nav-container" aria-label="Main Navigation">

    <a routerLink="/" class="nav-logo" aria-label="Scholar's Ascent Home">
      <span class="logo-icon" aria-hidden="true">⚔️</span>
      <span class="logo-text">
        Scholar's <span class="logo-accent">Ascent</span>
      </span>
    </a>

    <ul class="nav-links" role="menubar">
      <li role="none">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" role="menuitem">Home</a>
      </li>
      <li role="none">
        <a routerLink="/dashboard" routerLinkActive="active" role="menuitem">Dashboard</a>
      </li>
      <li role="none">
        <a routerLink="/lessons" routerLinkActive="active" role="menuitem">
          Quests
          <span class="quiz-warning" *ngIf="quizInProgress()" title="Quiz in progress!">⚠️</span>
        </a>
      </li>
      <li role="none">
    <a routerLink="/profile" routerLinkActive="active" role="menuitem">Hunter Profile</a>
      </li>
    </ul>
    <div class="nav-actions">
      <div class="nav-rank-badge" aria-label="Current Rank">
        <span class="rank-label">RANK</span>
        <span class="rank-value" [ngClass]="'rank-' + currentRank().toLowerCase()">
          {{ currentRank() }}
        </span>
      </div>

      <button
        *ngIf="isLoggedIn()"
        class="btn-logout-nav"
        (click)="onLogout()"
        aria-label="Logout">
        🚪 Exit
      </button>

      <a
        *ngIf="!isLoggedIn()"
        routerLink="/login"
        class="btn-login"
        aria-label="Login">
        Enter Gate
      </a>
    </div>

    <button
      class="nav-toggle"
      (click)="toggleMenu()"
      [class.open]="menuOpen"
      aria-label="Toggle mobile menu"
      [attr.aria-expanded]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </nav>

  <div class="mobile-menu" [class.open]="menuOpen" role="menu">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()" role="menuitem">Home</a>
    <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()" role="menuitem">Dashboard</a>
    <a routerLink="/lessons" routerLinkActive="active" (click)="closeMenu()" role="menuitem">Quests</a>
    <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()" role="menuitem">Hunter Profile</a>
    <button *ngIf="isLoggedIn()" class="mobile-logout" (click)="onLogout()" role="menuitem">🚪 Exit Gate</button>
    <a *ngIf="!isLoggedIn()" routerLink="/login" (click)="closeMenu()" role="menuitem">Enter Gate</a>
  </div>
</header>
